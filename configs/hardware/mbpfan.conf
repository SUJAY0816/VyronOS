[general]
# Hardware limits pulled from /sys/devices/platform/applesmc.768/
min_fan_speed = 2000 
max_fan_speed = 6200 

# Temperature at which fans start spinning up
low_temp = 55 

# Temperature at which fans run at high speed
high_temp = 78 

# Critical temperature threshold
max_temp = 90 

# Sensor polling interval in seconds
polling_interval = 2
