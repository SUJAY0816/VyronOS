set default="0"
set timeout=3

insmod font
insmod all_video
insmod gfxterm
terminal_output gfxterm

# VYRON Micro-OS EFI Menu
menuentry "VYRON Micro-OS v1.0 (Live Mac Edition)" --class os {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 console=tty1 libinput.tapping=1
    initrd /live/initrd.img
}

menuentry "VYRON Micro-OS (Apple Discrete GPU Safe Mode / nomodeset)" --class os {
    linux /live/vmlinuz boot=live components nomodeset noapic irqpoll
    initrd /live/initrd.img
}

menuentry "VYRON Micro-OS (RAM Ephemeral Toram Mode)" --class os {
    linux /live/vmlinuz boot=live components toram quiet splash loglevel=3
    initrd /live/initrd.img
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off" {
    halt
}
